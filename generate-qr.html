<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Generate Student QR Codes</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #f5f3ee; margin: 0; padding: 24px; }
  h1 { font-size: 18px; }
  .hint { color: #5b6675; font-size: 13px; margin-bottom: 20px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  .card {
    background: white;
    border: 1px solid #dfe2e6;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .card canvas { margin: 0 auto; }
  .card .name { font-size: 12px; font-weight: 600; margin-top: 6px; }
  .card .id { font-size: 11px; color: #5b6675; }
  @media print {
    .no-print { display: none; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>

<h1>Student QR Codes</h1>
<p class="hint">
  Each QR code encodes ONLY the student's ID (e.g. <code>SEC-M01</code>) — nothing personal is stored in
  the code itself. Print this page (or save each image) and give one to each student, e.g. as a laminated
  card or ID sticker.
</p>
<button class="no-print" onclick="window.print()">Print this page</button>

<div id="grid"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="students.js"></script>
<script>
  // For every student in students.js, draw a QR code containing just their ID.
  const grid = document.getElementById("grid");

  STUDENTS.forEach((s) => {
    const card = document.createElement("div");
    card.className = "card";

    const qrHolder = document.createElement("div");
    card.appendChild(qrHolder);

    const nameLine = document.createElement("div");
    nameLine.className = "name";
    nameLine.textContent = `${s.lastName}, ${s.firstName}`;
    card.appendChild(nameLine);

    const idLine = document.createElement("div");
    idLine.className = "id";
    idLine.textContent = s.id;
    card.appendChild(idLine);

    grid.appendChild(card);

    // QRCode() draws directly into qrHolder using the qrcodejs library.
    new QRCode(qrHolder, {
      text: s.id,       // <-- this is the payload the scanner will read
      width: 120,
      height: 120,
    });
  });
</script>
</body>
</html>
